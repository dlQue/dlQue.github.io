<!DOCTYPE html>
<html style="height: 100%;">
<head>
    <title>SDG 11.7.1a Dashboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevent scrolling */
            font-family: Arial, sans-serif;
            font-size: clamp(12px, 1.2vw, 16px); /* Minimum 12px, preferred 1.2vw, maximum 18px */
        }
        .HeaderHTML {
            flex-shrink: 0; /* Header stays the same height */
            display: flex;
            align-items: center;
            justify-content: space-between; /* Ensures space between text and logo */
            padding: 4px 15px;
            background-color: #ffffff; /* White background */
            color: #000000; /* Black font */
            box-sizing: border-box;
            flex-wrap: wrap; /* Allows text to wrap to a new line if needed */
        }
        .HeaderHTML .text-container {
            flex: 1; /* Take up remaining space */
            min-width: 0; /* Prevents the text container from shrinking too much */
            margin-right:15px; /* Space between text and logo */
        }
        .HeaderHTML h2 {
            font-family: Georgia, serif; /* Assuming $serif-font-stack is Georgia */
            margin: 0;
            color: #000000; /* Black font */
            white-space: normal; /* Allow wrapping */
            overflow: hidden;
            text-overflow: ellipsis; /* Adds ellipsis if title overflows */
            font-size: clamp(16px, 3vw, 24px); /* Minimum 16px, preferred 2vw, maximum 24px */
        }
        .HeaderHTML p {
            margin: 0;
            color: #000000; /* Black font */
            white-space: normal; /* Allow wrapping */
            overflow: hidden;
            text-overflow: ellipsis; /* Adds ellipsis if subtitle overflows */
            font-size: clamp(14px, 2vw, 20px); /* Minimum 14px, preferred 1.6vw, maximum 20px */
        }
        .HeaderHTML .logo {
            flex-shrink: 0; /* Prevents the logo from shrinking */
            margin-top: 8px;
        }
        .HeaderHTML .logo img {
            height: clamp(50px, 6vw, 80px); /* Minimum 50px, preferred 6vw, maximum 100px */
            width: auto; /* Maintain aspect ratio */
        }        
        #buttonPanel {
            flex-shrink: 0;
            display: flex;
            justify-content: flex-start; /* Align to the left */
            gap: 0; /* Remove gap between buttons */
            padding: 1px;
            background-color: #f7f7f7;
            border: 1px solid #ddd;
            border-radius: 10px; /* Make the corners rounded */
            width: fit-content;
            margin: 8px 10px; /* Align to the left with padding from the left edge */
            overflow: hidden; /* Ensure rounded corners apply to content */
            font-size: clamp(14px, 2vw, 18px); /* Minimum 12px, preferred 1.4vw, maximum 18px */
        }
        #buttonPanel button {
            flex: 1;
            padding: 6px 10px; /* Adjust padding for smaller buttons */
            background-color: #2980b9;
            color: white;
            border: none;
            cursor: pointer;
            border-right: 1px solid #ddd; /* Separate buttons with a border */
            border-radius: 0; /* Remove default button border radius */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #buttonPanel button svg {
            margin-right: 5px; /* Space between icon and text */
            height: 12px; /* Scale the icon size with viewport width */
            width: 12px;
        }
        #buttonPanel button:first-child {
            border-radius: 10px 0 0 10px; /* Round the left corners of the first button */
        }
        #buttonPanel button:last-child {
            border-right: none; /* Remove border from the last button */
            border-radius: 0 10px 10px 0; /* Round the right corners of the last button */
        }
        #buttonPanel button.active {
            background-color: #3498db; /* Highlight color for the selected button */
            font-weight: bold;
        }
        #buttonPanel button:hover {
            background-color: #3498db;
        }
        #mapFrameContainer {
            width: 100%;
            height: calc(100% - 220px); /* Adjust height to accommodate header, button panel, and footer */
            overflow: hidden;
            position: relative;
        }
        #mapFrame {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover; /* Ensures the map scales to always show the full world map */
        }
        .SourcesFooterHTML {
            flex-shrink: 0; /* Footer stays the same height based on content */
            padding: 10px 10px; /* Adjust padding for smaller footer */
            background-color: #ffffff; /* White background */
            color: #000000; /* Black font */
            border-top: 1px solid #ddd; /* Optional: a light border for separation */
            box-sizing: border-box;
            display: flex;
            align-items: flex-start; /* Align to the top of the container */
            font-size: clamp(12px, 1.2vw, 16px); /* Minimum 12px, preferred 1.2vw, maximum 16px */
            flex-wrap: wrap; /* Allow wrapping for the footer content */
            max-height: 15%; /* Constrain the footer height to a maximum of 15% of the viewport height */
            overflow-y: auto; /* Scroll if content exceeds the maximum height */
            position: relative; /* To allow positioning of download button */
        }
        .SourcesAndLicense {
            flex-grow: 1;
            margin-right: 10px; /* Adjusts space between the license and the download button */
            min-width: 0;
            overflow: hidden;
        }
        .SourcesFooterHTML p {
            margin: 0;
            white-space: normal; /* Allow text to wrap */
            overflow: hidden;
            text-overflow: ellipsis; /* Adds ellipsis if text overflows */
        }
        .downloadButton {
            padding: 8px 8px; /* Adjust padding for smaller button */
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: clamp(12px, 1.6vw, 16px); /* Adjust font size for the download button based on viewport width */
            display: flex;
            align-items: center;
            position: absolute; /* Positioning it to the right */
            right: 15px; /* 15px from the right edge */
            top: 10px; /* Align with the top of the footer */
        }
        .downloadButton svg {
            margin-right: clamp(2px, 1vw, 5px); /* Space between icon and text */
            height: 12px; /* Scale the icon size with viewport width */
            width: 12px;
        }
        /* Media query for small screens */
        @media (max-width: 600px) {
            .downloadButton span {
                display: none;
            }
        }    
    </style>
</head>

    <script>
        function selectTab(button, url) {
            // Remove active class from all buttons
            var buttons = document.querySelectorAll('#buttonPanel button');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
            });
            // Add active class to the clicked button
            button.classList.add('active');
            // Change the map frame src
            document.getElementById('mapFrame').src = url;
        }
    </script>
